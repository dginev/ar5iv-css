# Phase-1 CI: lint + build sanity check on every push and PR to main.
#
# Catches:
#   - stylelint violations (deprecated `word-wrap`, single-colon
#     pseudo-elements, etc.)
#   - TOKENS.md ↔ tokens.css drift via `tools/check-tokens.mjs`
#   - lightningcss bundle failures (brace mismatch, broken @-rules)
#
# Does NOT yet run the visual-regression harness — that requires
# Playwright browsers + a shared baseline tarball. Deferred per the
# iteration-5 #1 brief: hosting decision and same-machine AA-drift
# determinism (see docs/GLOWUP_PROGRESS.md) need to land first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: stylelint + TOKENS.md drift check
        run: npm run lint

      - name: lightningcss bundle build
        run: npm run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: ar5iv-css-dist
          path: dist/
          retention-days: 14
